<style>
/* ============ tokens ============ */
:root{
  --bg:#F6F6FB;
  --bg-2:#EDEDF6;
  --surface:#FFFFFF;
  --text:#12121C;
  --muted:#61617A;
  --faint:#8E8EA6;
  --line:#E3E3F0;
  --line-2:#CFCFE4;
  --iris:#5B4FE9;
  --iris-soft:#EEECFE;
  --mint:#0FA98E;
  --rose:#E8558F;
  --amber:#D98418;
  --shadow:0 24px 50px -34px rgba(20,20,50,.45);
  --shadow-sm:0 8px 24px -18px rgba(20,20,50,.5);
  --r:14px;
  --display:'Sora',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --fa:'Vazirmatn',var(--body);
  --maxw:1080px;
}
[data-theme="dark"]{
  --bg:#0A0A11;
  --bg-2:#101019;
  --surface:#14141F;
  --text:#F1F1F7;
  --muted:#9C9CB6;
  --faint:#71718C;
  --line:#22222F;
  --line-2:#2E2E40;
  --iris:#8B7FFF;
  --iris-soft:#1B1830;
  --mint:#2FD4B4;
  --rose:#FF7DAD;
  --amber:#F0A93C;
  --shadow:0 24px 50px -34px rgba(0,0,0,.9);
  --shadow-sm:0 8px 24px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:16.5px;line-height:1.7;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .4s ease,color .4s ease;
}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--iris);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
.fa{font-family:var(--fa);direction:rtl;unicode-bidi:isolate}

/* ============ nav ============ */
#bar{position:fixed;top:0;left:0;height:2px;width:0;z-index:80;
  background:linear-gradient(90deg,var(--iris),var(--rose))}
.nav{
  position:sticky;top:0;z-index:70;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;transition:border-color .3s;
}
.nav.stuck{border-bottom-color:var(--line)}
.navin{max-width:var(--maxw);margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:22px}
.brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;
}
.brand i{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--iris),var(--rose));
  color:#fff;font-style:normal;font-size:13px;font-weight:700;font-family:var(--display);
}
.navlinks{margin-left:auto;display:flex;align-items:center;gap:6px}
.navlinks a{
  text-decoration:none;color:var(--muted);font-size:14.5px;font-weight:500;
  padding:7px 13px;border-radius:99px;transition:color .2s,background .2s;
}
.navlinks a:hover,.navlinks a.on{color:var(--text);background:var(--bg-2)}
.tt{
  width:36px;height:36px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;
  margin-left:6px;transition:border-color .2s,transform .2s;flex:0 0 auto;
}
.tt:hover{border-color:var(--line-2);transform:rotate(-18deg)}
.tt svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
[data-theme="dark"] .tt .moon{display:none}
:root:not([data-theme="dark"]) .tt .sun{display:none}
@media(max-width:700px){.navlinks a{padding:7px 9px;font-size:13.5px}.brand span{display:none}}

/* ============ headings ============ */
.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--iris);margin-bottom:16px;display:block;
}
h2.sec{font-family:var(--display);font-weight:700;font-size:clamp(27px,4vw,40px);
  line-height:1.12;letter-spacing:-.03em;margin-bottom:12px}
.lead{color:var(--muted);max-width:58ch;margin-bottom:44px;font-size:17px}
section{padding:88px 0;position:relative}

/* ============ hero ============ */
.hero{position:relative;padding:96px 0 84px;overflow:hidden}
.aurora{position:absolute;inset:-20% -10% auto;height:620px;z-index:0;pointer-events:none;filter:blur(90px);opacity:.5}
[data-theme="dark"] .aurora{opacity:.42}
.blob{position:absolute;border-radius:50%}
.b1{width:460px;height:460px;background:var(--iris);left:2%;top:4%;animation:float1 22s ease-in-out infinite}
.b2{width:380px;height:380px;background:var(--rose);left:44%;top:22%;animation:float2 19s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--mint);left:72%;top:0%;animation:float3 26s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,60px)}}
.hero .wrap{position:relative;z-index:1}
.tagpill{
  display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  padding:7px 15px;border-radius:99px;margin-bottom:26px;box-shadow:var(--shadow-sm);
}
.ping{width:7px;height:7px;border-radius:50%;background:var(--mint);position:relative}
.ping::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--mint);opacity:.35;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.6);opacity:0}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,7vw,68px);

.hero p.intro b{color:var(--text);font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:11px}
.btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;
  font-family:var(--body);font-size:15px;font-weight:600;padding:11px 21px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);

}
.btn:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.btn.pri{background:var(--iris);border-color:var(--iris);color:#fff}
.btn.pri:hover{opacity:.92}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ============ generic cards ============ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:860px){.grid3,.grid2{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s,border-color .28s;
}
.card:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--shadow)}
.ctag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--iris);margin-bottom:12px;display:block}
.ctitle{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;
  line-height:1.3;margin-bottom:8px}

/* ============ work timeline ============ */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(var(--iris),var(--rose),transparent)}
.job{position:relative;padding-bottom:34px}
.job::before{content:"";position:absolute;left:-26px;top:9px;width:10px;height:10px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line-2);transition:all .45s}
.job.in::before{background:var(--iris);border-color:var(--iris);box-shadow:0 0 0 5px var(--iris-soft)}
.jhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.jrole{font-family:var(--display);font-weight:700;font-size:18.5px;letter-spacing:-.02em}
.jwhen{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap}
.jorg{font-size:14.5px;color:var(--iris);font-weight:600;margin-bottom:8px}
.jorg span{color:var(--faint);font-weight:400}
.job p{font-size:15.5px;color:var(--muted)}

/* ============ publications ============ */
.pub{
  display:flex;gap:18px;align-items:flex-start;text-decoration:none;
  padding:17px 6px;border-bottom:1px solid var(--line);
  transition:padding-left .28s,background .28s;
}
.pub:first-of-type{border-top:1px solid var(--line)}
.pub:hover{padding-left:14px;background:var(--bg-2)}
.pyr{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 42px;padding-top:5px}
.ptitle{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.4;letter-spacing:-.015em}
.pven{font-family:var(--mono);font-size:11px;color:var(--iris);margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
.parrow{margin-left:auto;color:var(--faint);opacity:0;transform:translateX(-6px);transition:all .25s;padding-top:4px}
.pub:hover .parrow{opacity:1;transform:none}

/* ============ skills ============ */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 42px}
@media(max-width:760px){.sgrid{grid-template-columns:1fr}}
.sgroup h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:400;margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13.5px;font-weight:500;background:var(--surface);border:1px solid var(--line);
  padding:5px 12px;border-radius:99px;transition:all .2s;cursor:default}
.chip:hover{border-color:var(--iris);color:var(--iris);transform:translateY(-2px)}

/* ============ education ============ */
.deg{border-left:2px solid var(--iris);padding:2px 0 2px 18px}
.deg h3{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.deg p{font-size:14.5px;color:var(--muted);margin-top:2px}
.deg .gpa{font-family:var(--mono);font-size:12px;color:var(--mint);margin-top:4px}

/* ============ contact ============ */
.mail{
  font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:1.05;
  font-size:clamp(26px,5.4vw,58px);text-decoration:none;display:inline-block;word-break:break-word;
  background-image:linear-gradient(90deg,var(--iris),var(--rose));
  background-size:0% 3px;background-position:0 100%;background-repeat:no-repeat;
  transition:background-size .5s cubic-bezier(.2,.7,.3,1);
}
.mail:hover{background-size:100% 3px}
footer{border-top:1px solid var(--line);margin-top:80px;padding:24px 0 34px}
.fin{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;color:var(--faint)}

/* ============ page header (sub-pages) ============ */
.phead{padding:64px 0 32px;position:relative;overflow:hidden}
.phead h1{font-size:clamp(32px,5.4vw,52px);margin-bottom:14px}
.phead p{color:var(--muted);max-width:56ch;font-size:17px}

/* ============ reveal ============ */
.rv{opacity:0;transform:translateY(26px);
  transition:opacity .75s cubic-bezier(.2,.7,.3,1),transform .75s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .blob,.ping::after{animation:none}
  *{transition-duration:.01ms!important}
}

<script>
/* theme — set as early as possible to avoid a flash */
(function () {
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);

  window.toggleTheme = function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    window.dispatchEvent(new CustomEvent('themechange', { detail: next }));
  };
})();

document.addEventListener('DOMContentLoaded', function () {
  /* scroll progress + sticky nav border */
  var bar = document.getElementById('bar');
  var nav = document.querySelector('.nav');
  function onScroll() {
    if (bar) {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    }
    if (nav) nav.classList.toggle('stuck', window.scrollY > 6);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* reveal on scroll */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

  document.querySelectorAll('.rv').forEach(function (el, i) {
    el.style.transitionDelay = (Math.min(i % 5, 4) * 70) + 'ms';
    io.observe(el);
  });

  /* footer year */
  document.querySelectorAll('.yr').forEach(function (el) {
    el.textContent = new Date().getFullYear();
  });
});

</script>

<script>
/* ------------------------------------------------------------------
   To add a post: copy one object, put it at the top of the array.
   `body` is plain HTML — <p>, <h2>, <ul>, <blockquote>, <code>.
------------------------------------------------------------------ */
var POSTS = [
  {
    slug: 'test-set-lying',
    title: 'Your test set is probably lying to you',
    date: 'August 2026',
    read: '6 min',
    tag: 'Trustworthy AI',
    excerpt: 'A model that scores 96% on a held-out set can still fail the first day it meets real users. The number isn\u2019t wrong — it just answers a narrower question than we think it does.',
    body: [
      '<p>Every deep learning project ends the same way. Someone puts a number on a slide — accuracy, F1, AUC — and the room relaxes. The model is good. Ship it.</p>',
      '<p>Then it meets real users and falls over.</p>',
      '<p>The number was never wrong. It just answered a much narrower question than anyone in the room thought it did: <strong>how well does this model do on data that looks exactly like the data I already had?</strong></p>',
      '<h2>What accuracy actually measures</h2>',
      '<p>A test set is a sample. Accuracy is an estimate of performance on the distribution that sample was drawn from. That estimate is only as trustworthy as the sample is representative — and in practice, our test sets are drawn from the same collection process, the same annotators, the same time window, and often the same handful of source domains as our training data.</p>',
      '<p>So the honest reading of "96% test accuracy" is closer to: <em>on inputs indistinguishable from the ones I already trained on, this model is right 96% of the time.</em> Useful! But not the claim we make with it.</p>',
      '<h2>The adequacy question</h2>',
      '<p>The question worth asking is different, and it comes from software testing rather than statistics: <strong>is this test set adequate?</strong> Does it exercise the model thoroughly enough that a high score means something?</p>',
      '<p>In traditional software we have decades of machinery for this — statement coverage, branch coverage, mutation testing. You don\u2019t just run the tests, you ask whether the tests would have caught a bug if one existed. Deep neural networks have no equivalent that works reliably, which is a strange gap for systems we put in cars and hospitals.</p>',
      '<blockquote>A passing test suite is only evidence if you know the suite could have failed.</blockquote>',

var plist = document.getElementById('plist');
var filters = document.getElementById('filters');
var listview = document.getElementById('listview');
var postview = document.getElementById('postview');
var article = document.getElementById('article');
var active = 'All';

function tags() {
  var t = ['All'];
  POSTS.forEach(function (p) { if (t.indexOf(p.tag) === -1) t.push(p.tag); });
  return t;
}

function renderFilters() {
  filters.innerHTML = '';
  tags().forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'fbtn' + (t === active ? ' on' : '');
    b.textContent = t;
    b.onclick = function () { active = t; renderFilters(); renderList(); };
    filters.appendChild(b);
  });
}

function renderList() {
  var items = POSTS.filter(function (p) { return active === 'All' || p.tag === active; });
  if (!items.length) { plist.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  plist.innerHTML = '';
  items.forEach(function (p, i) {
    var b = document.createElement('button');
    b.className = 'pcard rv';
    b.style.transitionDelay = (Math.min(i, 4) * 70) + 'ms';
    b.innerHTML =
      '<div class="pmeta"><span class="ptag">' + p.tag + '</span><span>' + p.date + '</span><span>' + p.read + '</span></div>' +
      '<h3>' + p.title + '</h3><p>' + p.excerpt + '</p>' +
      '<span class="readmore">Read →</span>';
    b.onclick = function () { openPost(p.slug); };
    plist.appendChild(b);
    requestAnimationFrame(function () { b.classList.add('in'); });
  });
}

function openPost(slug) {
  var p = POSTS.filter(function (x) { return x.slug === slug; })[0];
  if (!p) return showList();
  article.innerHTML =
    '<div class="pmeta"><span class="ptag">' + p.tag + '</span><span>' + p.date + '</span><span>' + p.read + '</span></div>' +
    '<h1 style="font-size:clamp(28px,4.6vw,42px);margin-bottom:26px">' + p.title + '</h1>' + p.body;
  listview.style.display = 'none';
  postview.style.display = 'block';
  if (location.hash !== '#' + slug) history.pushState(null, '', '#' + slug);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function showList() {
  postview.style.display = 'none';
  listview.style.display = 'block';
  if (location.hash) history.pushState(null, '', location.pathname);
}

window.addEventListener('popstate', function () {
  var s = location.hash.slice(1);
  s ? openPost(s) : showList();
});

renderFilters();
renderList();
if (location.hash.slice(1)) openPost(location.hash.slice(1));
</script>
